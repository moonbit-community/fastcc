name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: moonbit-community/setup-moonbit@main
      - name: Show MoonBit version
        run: moon version
      - name: Update MoonBit package index
        run: moon update
      - name: Install fastcc and expose it in PATH
        run: |
          moon install ./src/cmd/fastcc
          echo "${MOON_HOME:-$HOME/.moon}/bin" >> "$GITHUB_PATH"
      - name: Patch cmd/fastcc to use fastcc toolchain in this CI run
        run: |
          python3 - <<'PY'
          from pathlib import Path

          moon_pkg = Path("src/cmd/fastcc/moon.pkg")
          text = moon_pkg.read_text()
          old = '  link: { "native": { "cc-flags": "-w" } },\n'
          new = '  link: { "native": { "cc": "fastcc", "cc-flags": "-w" } },\n'

          if old not in text:
              raise SystemExit("unexpected src/cmd/fastcc/moon.pkg content")

          moon_pkg.write_text(text.replace(old, new))
          print("patched src/cmd/fastcc/moon.pkg for CI")
          PY
      - name: Init and update git submodules
        run: git submodule init && git submodule update
      - name: Install sqlite test dependencies
        run: |
          if ! command -v tclsh >/dev/null 2>&1; then
            brew install tcl-tk
          fi
      - name: Run moon test
        run: moon test
      - name: Run mbtcc tests
        env:
          QUICKJS: "1"
          QUICKJS_TESTS: "1"
          QUICKJS_TEST_LIST: "tests/test_closure.js tests/test_language.js tests/test_builtin.js tests/test_loop.js tests/test_bigint.js tests/test_cyclic_import.js tests/test_std.js"
        run: scripts/run_mbtcc_ctest.sh
      - name: Run sqlite tests
        env:
          SQLITE_PATCH: ${{ github.workspace }}/patches/refs-sqlite/sqlite-test-harness.patch
          SQLITE_TEST_LIST: "test/veryquick.test"
          QUICKTEST_OMIT: "^busy2\\.test$,^syscall\\.test$,^walsetlk\\.test$"
        run: scripts/run_sqlite_tests.sh
